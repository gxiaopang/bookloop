name: bookloop

x-backend-build: &backend-build
  context: ./backend
  dockerfile: Dockerfile

x-backend-environment: &backend-environment
  APP_ENV: ${APP_ENV:?APP_ENV is required}
  HTTP_ADDR: :8080
  TRUSTED_PROXIES: 172.30.88.10
  LOG_LEVEL: ${LOG_LEVEL:-info}
  DB_HOST: mysql
  DB_PORT: 3306
  DB_NAME: ${MYSQL_DATABASE:?MYSQL_DATABASE is required}
  DB_USER: ${MYSQL_USER:?MYSQL_USER is required}
  DB_PASSWORD: ${MYSQL_PASSWORD:?MYSQL_PASSWORD is required}
  DB_MAX_OPEN_CONNS: ${DB_MAX_OPEN_CONNS:-25}
  DB_MAX_IDLE_CONNS: ${DB_MAX_IDLE_CONNS:-10}
  REDIS_ADDR: redis:6379
  REDIS_PASSWORD: ${REDIS_PASSWORD:?REDIS_PASSWORD is required}
  REDIS_DB: 0
  JWT_SECRET: ${JWT_SECRET:?JWT_SECRET is required}
  JWT_ISSUER: ${JWT_ISSUER:-bookloop}
  JWT_EXPIRES_IN: ${JWT_EXPIRES_IN:-15m}
  BCRYPT_COST: ${BCRYPT_COST:-12}
  UPLOAD_DIR: /app/uploads
  UPLOAD_PUBLIC_PREFIX: /uploads/
  UPLOAD_MAX_BYTES: ${UPLOAD_MAX_BYTES:-10485760}
  ORDER_PAYMENT_TIMEOUT: ${ORDER_PAYMENT_TIMEOUT:-15m}
  IDEMPOTENCY_PROCESSING_TTL: ${IDEMPOTENCY_PROCESSING_TTL:-30s}
  IDEMPOTENCY_RESULT_TTL: ${IDEMPOTENCY_RESULT_TTL:-24h}
  IDEMPOTENCY_ALLOW_DEGRADED: ${IDEMPOTENCY_ALLOW_DEGRADED:-true}

services:
  mysql:
    image: mysql:8.4
    restart: unless-stopped
    environment:
      MYSQL_DATABASE: ${MYSQL_DATABASE:?MYSQL_DATABASE is required}
      MYSQL_USER: ${MYSQL_USER:?MYSQL_USER is required}
      MYSQL_PASSWORD: ${MYSQL_PASSWORD:?MYSQL_PASSWORD is required}
      MYSQL_ROOT_PASSWORD: ${MYSQL_ROOT_PASSWORD:?MYSQL_ROOT_PASSWORD is required}
    command:
      - --character-set-server=utf8mb4
      - --collation-server=utf8mb4_0900_ai_ci
      - --default-time-zone=+00:00
    volumes:
      - mysql_data:/var/lib/mysql
    networks:
      - internal
    healthcheck:
      test: ["CMD-SHELL", "MYSQL_PWD=\"$${MYSQL_ROOT_PASSWORD}\" mysqladmin ping -h 127.0.0.1 -uroot --silent"]
      interval: 5s
      timeout: 5s
      retries: 20
      start_period: 20s
    security_opt:
      - no-new-privileges:true

  redis:
    image: redis:7-alpine
    restart: unless-stopped
    environment:
      REDIS_PASSWORD: ${REDIS_PASSWORD:?REDIS_PASSWORD is required}
      REDIS_MAXMEMORY: ${REDIS_MAXMEMORY:-128mb}
    command:
      - /bin/sh
      - -c
      - exec redis-server --requirepass "$${REDIS_PASSWORD}" --maxmemory "$${REDIS_MAXMEMORY}" --maxmemory-policy noeviction --save ""
    networks:
      - internal
    healthcheck:
      test: ["CMD-SHELL", "REDISCLI_AUTH=\"$${REDIS_PASSWORD}\" redis-cli ping | grep -q PONG"]
      interval: 5s
      timeout: 3s
      retries: 12
      start_period: 5s
    security_opt:
      - no-new-privileges:true

  migrate:
    image: bookloop-backend:local
    entrypoint: ["/app/migrate"]
    command: ["-dir", "/app/migrations"]
    environment: *backend-environment
    depends_on:
      mysql:
        condition: service_healthy
    networks:
      - internal
    restart: "no"
    read_only: true
    tmpfs:
      - /tmp
    cap_drop:
      - ALL
    security_opt:
      - no-new-privileges:true

  backend:
    image: bookloop-backend:local
    build: *backend-build
    restart: unless-stopped
    init: true
    environment: *backend-environment
    depends_on:
      migrate:
        condition: service_completed_successfully
      redis:
        condition: service_healthy
    volumes:
      - book_uploads:/app/uploads
    networks:
      - internal
    read_only: true
    tmpfs:
      - /tmp
    cap_drop:
      - ALL
    security_opt:
      - no-new-privileges:true
    healthcheck:
      test: ["CMD", "wget", "-q", "-O", "/dev/null", "http://127.0.0.1:8080/readyz"]
      interval: 10s
      timeout: 3s
      retries: 6
      start_period: 15s
    stop_grace_period: 15s

  nginx:
    image: bookloop-nginx:local
    build:
      context: ./frontend
      dockerfile: Dockerfile
      args:
        VITE_API_BASE_URL: /api/v1
        VITE_ASSET_BASE_URL: ""
    restart: unless-stopped
    depends_on:
      backend:
        condition: service_healthy
    ports:
      - "${BOOKLOOP_BIND_ADDRESS:-127.0.0.1}:${BOOKLOOP_HTTP_PORT:-8088}:80"
    volumes:
      - book_uploads:/srv/bookloop/uploads:ro
    networks:
      edge:
      internal:
        ipv4_address: 172.30.88.10
    security_opt:
      - no-new-privileges:true
    healthcheck:
      test: ["CMD", "wget", "-q", "-O", "/dev/null", "http://127.0.0.1/healthz"]
      interval: 10s
      timeout: 3s
      retries: 6
      start_period: 10s

volumes:
  mysql_data:
  book_uploads:

networks:
  edge:
  internal:
    internal: true
    ipam:
      config:
        - subnet: 172.30.88.0/24
